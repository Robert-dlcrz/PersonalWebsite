name: E2E

# Runs the Playwright steel-thread against the Vercel preview for a commit, so it
# has to start after Vercel finishes deploying rather than on `pull_request`.
# This is deliberately separate from verify.yml, which lints, unit tests, and builds.
on:
  # Primary: Vercel's "Deployment Success" GitHub integration webhook.
  repository_dispatch:
    types: [vercel.deployment.success]
  # Fallback: the deployment statuses the Vercel GitHub app already publishes.
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Preview URL to test, e.g. https://personal-website-abc123-owner.vercel.app
        required: true
        type: string
      ref:
        description: Git ref or SHA to check out (defaults to the selected branch)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    e2e-${{ github.event.client_payload.git.sha
    || github.event.deployment_status.environment_url
    || inputs.base_url
    || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve preview target
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.target.outputs.should_run }}
      base_url: ${{ steps.target.outputs.base_url }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      # Payload values are read through env rather than inlined into the script.
      - name: Resolve preview URL and commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ github.event.client_payload.url }}
          DISPATCH_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          DISPATCH_SHA: ${{ github.event.client_payload.git.sha }}
          STATUS_STATE: ${{ github.event.deployment_status.state }}
          STATUS_ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          STATUS_URL: ${{ github.event.deployment_status.environment_url }}
          STATUS_SHA: ${{ github.event.deployment.sha }}
          INPUT_URL: ${{ inputs.base_url }}
          INPUT_REF: ${{ inputs.ref }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          should_run=false
          base_url=""
          sha="$FALLBACK_SHA"
          skip_reason=""

          case "$EVENT_NAME" in
            repository_dispatch)
              if [ "${DISPATCH_ENVIRONMENT,,}" = "preview" ]; then
                base_url="$DISPATCH_URL"
                sha="${DISPATCH_SHA:-$FALLBACK_SHA}"
                should_run=true
              else
                skip_reason="client_payload.environment is '$DISPATCH_ENVIRONMENT', not 'preview'"
              fi
              ;;
            deployment_status)
              status_environment_lower="${STATUS_ENVIRONMENT,,}"
              if [ "$STATUS_STATE" != "success" ]; then
                skip_reason="deployment state is '$STATUS_STATE', not 'success'"
              elif [ "${status_environment_lower#preview}" = "$status_environment_lower" ]; then
                skip_reason="deployment environment is '$STATUS_ENVIRONMENT', not a preview"
              else
                base_url="$STATUS_URL"
                sha="${STATUS_SHA:-$FALLBACK_SHA}"
                should_run=true
              fi
              ;;
            workflow_dispatch)
              base_url="$INPUT_URL"
              sha="${INPUT_REF:-$FALLBACK_SHA}"
              should_run=true
              ;;
            *)
              skip_reason="unsupported event '$EVENT_NAME'"
              ;;
          esac

          if [ "$should_run" != "true" ]; then
            echo "Skipping e2e: $skip_reason"
            echo "should_run=false" >>"$GITHUB_OUTPUT"
            echo "Skipped e2e: $skip_reason" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_url="${base_url%/}"

          case "$base_url" in
            https://*) ;;
            *)
              echo "::error::Could not resolve an https preview URL (got '$base_url')."
              exit 1
              ;;
          esac

          # Guard against ever pointing the suite at the live site.
          host="${base_url#https://}"
          host="${host%%/*}"
          case "$host" in
            robertdelacruz.com | www.robertdelacruz.com)
              echo "::error::Refusing to run e2e against production ($host)."
              exit 1
              ;;
          esac

          echo "Resolved preview $base_url at commit $sha (via $EVENT_NAME)"

          echo "should_run=true" >>"$GITHUB_OUTPUT"
          echo "base_url=$base_url" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

          {
            echo "### E2E target"
            echo ""
            echo "- Trigger: \`$EVENT_NAME\`"
            echo "- Preview: $base_url"
            echo "- Commit: \`$sha\`"
          } >>"$GITHUB_STEP_SUMMARY"

  e2e:
    name: Playwright (chromium)
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ needs.resolve.outputs.base_url }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
